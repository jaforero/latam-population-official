schema_version: 2
verified_at: '2026-11-01'
verification_method: Cada URL se abrió con comprobación TLS activa y agente identificado. Los bloqueos se registran
  y no se eluden. Las cifras de control se leyeron en el archivo o, si se indica, en navegador.
verification_caveat: Comprobado desde una conexión residencial en Colombia; los ejecutores de GitHub Actions pueden
  recibir bloqueos distintos.
status_values:
  ok: descargable por script y cifra de control leída
  manual: dato existe pero la descarga automática no procede; un humano deja el archivo en data/raw/
  pendiente: sin archivo verificado; nunca se rellena
license_review:
  reviewed: '2026-11-01'
  method: Se buscó el texto aplicable a cada archivo con agente identificado y, si el sitio rechazaba al script, en navegador. Las verificaciones anti-bots no se eludieron.
  caveat:
    es: Es una lectura de textos publicados, no un dictamen jurídico. Si una licencia específica y unos términos generales difieren, se registra la específica y se anota la diferencia.
    en: This is a reading of published texts, not a legal opinion. Where a specific licence and general terms differ, the specific one is recorded and the difference noted.
license_status_values:
  open_license: licencia abierta declarada y leída para el archivo o su sitio
  own_terms: condiciones propias leídas; permiten reutilizar con cita, sin licencia abierta estándar
  no_license: no se localizó permiso aplicable al archivo; no equivale a una prohibición
  restricted: el texto localizado limita la redistribución o las obras derivadas
licenses:
  indec:
    institution: INDEC
    countries: [ARG]
    status: open_license
    name: Creative Commons (el pie del sitio enlaza CC BY-SA 4.0)
    license_url: https://creativecommons.org/licenses/by-sa/4.0/deed.es
    terms_url: https://www.indec.gob.ar/ftp/cuadros/publicaciones/politica_difusion_indec.pdf
    read_how: direct
    raw_copy: allowed
    commercial: allowed
    share_alike: true
    attribution: 'Fuente: INDEC, Argentina'
    summary:
      es: Permite copiar, reutilizar y redistribuir si se acredita la obra, se cita la fuente primaria y se indican los cambios. La política dice Creative Commons sin versión; el pie del sitio enlaza CC BY-SA 4.0.
      en: Allows copying, reuse and redistribution if the work is credited, the primary source cited and changes indicated. The policy says Creative Commons with no version; the site footer links to CC BY-SA 4.0.
  ine_bol:
    institution: INE Bolivia
    countries: [BOL]
    status: own_terms
    name: Términos y condiciones del INE (Ley 1405)
    terms_url: https://www.ine.gob.bo/index.php/terminos-y-condiciones/
    read_how: direct
    raw_copy: allowed_with_source
    commercial: needs_authorization
    share_alike: false
    attribution: 'Fuente: Instituto Nacional de Estadística (INE), Estado Plurinacional de Bolivia'
    summary:
      es: Los datos agregados son públicos y toda reproducción o redistribución debe citar al INE; los cálculos propios deben identificarse. Limita el uso comercial sin autorización y prohíbe el scraping no autorizado. El acceso no cede derechos (Art. 23).
      en: Aggregate data are public and any reproduction or redistribution must cite INE; your own calculations must be identified. It limits commercial use without authorization and bans unauthorized scraping. Access grants no rights (Art. 23).
  ibge:
    institution: IBGE
    countries: [BRA]
    status: no_license
    name: Sin licencia localizada para estos archivos
    terms_url: https://www.ibge.gov.br/acesso-informacao/acoes-e-programas/politica-de-privacidade.html
    read_how: browser
    raw_copy: not_stated
    commercial: not_stated
    share_alike: false
    attribution: 'Fonte: IBGE, Projeções da População, revisão 2024'
    summary:
      es: El Termo de Uso del portal trata servicios y privacidad, no la reutilización de datos. La Agência de Notícias permite reproducir su propio contenido citando la fuente, y el Plan de Datos Abiertos prevé abrir la Proyección de Población, pero no se localizó la licencia de estos archivos.
      en: The portal's Termo de Uso covers services and privacy, not data reuse. The Agência de Notícias allows reproducing its own content with credit, and the Open Data Plan expects to open the Population Projection, but no licence was found for these files.
  ine_chl:
    institution: INE Chile
    countries: [CHL]
    status: open_license
    name: CC BY-SA 4.0
    license_url: https://creativecommons.org/licenses/by-sa/4.0/deed.es
    terms_url: https://www.ine.gob.cl/terminos-de-uso-y-licencia-de-datos-abiertos
    read_how: direct
    raw_copy: allowed
    commercial: allowed
    share_alike: true
    attribution: 'Fuente: INE, Estimaciones y proyecciones de población 1992-2070, base 2024'
    summary:
      es: Permite compartir y adaptar, incluso con fines comerciales, reconociendo al INE, enlazando la licencia e indicando cambios. Lo derivado se comparte bajo la misma licencia y no debe presentarse como obra del INE.
      en: Allows sharing and adapting, including commercially, with credit to INE, a link to the licence and an indication of changes. Derived work is shared under the same licence and must not be presented as INE's.
  dane:
    institution: DANE
    countries: [COL]
    status: own_terms
    name: Condiciones generales de uso del portal del DANE
    terms_url: https://www.dane.gov.co/index.php/terrminos-y-condiciones-dane
    read_how: direct
    raw_copy: not_stated
    commercial: not_stated
    share_alike: false
    attribution: 'Fuente: Departamento Administrativo Nacional de Estadística: www.dane.gov.co'
    summary:
      es: Autoriza el uso, aprovechamiento, transformación y análisis con una cita textual obligatoria. No menciona la redistribución de los archivos originales y describe el acceso como licencia de usuario final.
      en: Authorizes use, exploitation, transformation and analysis with a mandatory verbatim citation. It does not mention redistributing the original files and describes access as an end-user licence.
  inec_cri:
    institution: INEC Costa Rica
    countries: [CRI]
    status: open_license
    name: CC BY-SA 4.0
    license_url: https://creativecommons.org/licenses/by-sa/4.0/
    terms_url: https://inec.cr/
    read_how: browser
    raw_copy: allowed
    commercial: allowed
    share_alike: true
    attribution: 'Fuente: INEC-Costa Rica, Estimaciones y proyecciones de población 1950-2100'
    summary:
      es: El pie del sitio declara CC BY-SA 4.0, junto a la frase «todos los derechos reservados». Se registra la licencia por ser la declaración específica. Según extractos de buscador, algunas publicaciones en PDF traen un aviso más estrecho; estos archivos Excel no lo traen.
      en: The site footer declares CC BY-SA 4.0, next to the phrase "all rights reserved". The licence is recorded as the specific statement. According to search excerpts, some PDF publications carry a narrower notice; these Excel files do not.
  un_wpp:
    institution: ONU · División de Población
    countries: [CUB, HND, HTI, NIC]
    status: open_license
    name: CC BY 3.0 IGO
    license_url: https://creativecommons.org/licenses/by/3.0/igo/
    terms_url: https://population.un.org/wpp/downloads?folder=Standard%20Projections&group=CSV%20format
    read_how: browser
    raw_copy: allowed
    commercial: allowed
    share_alike: false
    attribution: 'United Nations, Department of Economic and Social Affairs, Population Division (2024). World Population Prospects 2024, Online Edition.'
    summary:
      es: La página de descargas publica los datos bajo CC BY 3.0 IGO, que permite compartir y adaptar con atribución e indicación de cambios. Son estimaciones y proyecciones de la ONU, no cifras de una institución nacional; se usan solo donde esta no publica la serie.
      en: The downloads page publishes the data under CC BY 3.0 IGO, which allows sharing and adapting with credit and an indication of changes. These are UN estimates and projections, not figures from a national institution; they are used only where that institution does not publish the series.
  one_dom:
    institution: ONE
    countries: [DOM]
    status: open_license
    name: Open Database License (ODbL)
    license_url: https://opendatacommons.org/licenses/odbl/1-0/
    terms_url: https://datos.gob.do/dataset/estimaciones-y-proyecciones-de-la-poblacion-total-segun-sexo-y-grupos-quinquenales-de-edad-1950-2050
    read_how: direct
    raw_copy: allowed
    commercial: allowed
    share_alike: true
    attribution: 'Fuente: Oficina Nacional de Estadística (ONE), República Dominicana, vía datos.gob.do'
    summary:
      es: La ficha del conjunto declara ODbL, que permite compartir y adaptar con atribución; la base derivada se comparte bajo la misma licencia. Los términos generales del portal no ceden derechos sobre sus contenidos; se registra la licencia de la ficha.
      en: The dataset page declares ODbL, which allows sharing and adapting with attribution; a derived database is shared under the same licence. The portal's general terms grant no rights over its content; the licence on the dataset page is the one recorded.
  inec_ecu:
    institution: INEC Ecuador
    countries: [ECU]
    status: open_license
    name: CC BY 4.0
    license_url: https://creativecommons.org/licenses/by/4.0/deed.es
    terms_url: https://www.ecuadorencifras.gob.ec/proyecciones-poblacionales/
    read_how: direct
    raw_copy: allowed
    commercial: allowed
    share_alike: false
    attribution: 'Fuente: INEC Ecuador, Estimación y proyección de población, revisión 2024'
    summary:
      es: La página de proyecciones declara CC BY 4.0, que permite compartir y adaptar con atribución, enlace a la licencia e indicación de cambios.
      en: The projections page declares CC BY 4.0, which allows sharing and adapting with credit, a link to the licence and an indication of changes.
  ine_gtm:
    institution: INE Guatemala
    countries: [GTM]
    status: no_license
    name: Sin licencia localizada para este archivo
    terms_url: https://www.ine.gob.gt/proyecciones/
    read_how: browser
    raw_copy: not_stated
    commercial: not_stated
    share_alike: false
    attribution: 'Fuente: INE Guatemala, Estimaciones y proyecciones de población 1950-2050'
    summary:
      es: La página del archivo solo muestra copyright. Un conjunto hermano, las proyecciones municipales 2015-2030 en datos.ine.gob.gt, declara Open Data Commons Attribution, pero no es este archivo.
      en: The file's page shows only a copyright line. A sibling dataset, the 2015-2030 municipal projections on datos.ine.gob.gt, declares Open Data Commons Attribution, but it is not this file.
  ine_hnd:
    institution: INE Honduras
    countries: [HND]
    status: no_license
    name: Sin licencia localizada para este archivo
    terms_url: https://ine.gob.hn/wp-content/uploads/2025/02/Tomo-9-Proyecciones-poblacion-2013-2050.pdf
    read_how: in_file
    raw_copy: not_stated
    commercial: not_stated
    share_alike: false
    attribution: 'Fuente: Instituto Nacional de Estadística (INE), Honduras. Tomo 9: Proyecciones de Población 2013-2050'
    summary:
      es: El Tomo 9 solo lleva «D.R. ©». Un boletín reciente del INE sí permite reproducir texto, gráficos y estadísticas citando la fuente, pero esa frase se refiere a esa publicación.
      en: Volume 9 carries only "D.R. ©". A recent INE bulletin does allow reproducing text, charts and statistics with credit, but that sentence refers to that publication.
  conapo:
    institution: CONAPO
    countries: [MEX]
    status: open_license
    name: CC BY 4.0
    license_url: https://creativecommons.org/licenses/by/4.0/deed.es
    terms_url: https://www.datos.gob.mx/dataset/proyecciones-de-poblacion
    read_how: browser
    raw_copy: allowed
    commercial: allowed
    share_alike: false
    attribution: 'Fuente: Secretaría General del Consejo Nacional de Población (CONAPO), Proyecciones de población, vía datos.gob.mx'
    summary:
      es: La ficha del conjunto declara CC BY 4.0 y CONAPO describe sus datos abiertos como de libre uso citando la fuente. Los términos generales de gob.mx son más estrechos; se registra la licencia de la ficha.
      en: The dataset page declares CC BY 4.0 and CONAPO describes its open data as free to use with credit. The general gob.mx terms are narrower; the licence on the dataset page is the one recorded.
  inide:
    institution: INIDE
    countries: [NIC]
    status: no_license
    name: Sin licencia localizada para este archivo
    terms_url: https://www.inide.gob.ni/Home/About
    read_how: direct
    raw_copy: not_stated
    commercial: not_stated
    share_alike: false
    attribution: 'Fuente: Instituto Nacional de Información de Desarrollo (INIDE), Anuario Estadístico 2023'
    summary:
      es: El sitio declara todos los derechos reservados y el Anuario no trae licencia. El Decreto 68-2011 regula solo las bases de censos y encuestas; pide acreditar al INIDE y prohíbe copiarlas con lucro o transferirlas sin su conocimiento.
      en: The site declares all rights reserved and the Yearbook carries no licence. Decree 68-2011 covers only census and survey databases; it requires crediting INIDE and bans copying them for profit or transferring them without its knowledge.
  inec_pan:
    institution: INEC Panamá
    countries: [PAN]
    status: open_license
    name: CC BY 4.0
    license_url: https://creativecommons.org/licenses/by/4.0/deed.es
    terms_url: https://www.inec.gob.pa/
    read_how: direct
    raw_copy: allowed
    commercial: allowed
    share_alike: false
    attribution: 'Fuente: Instituto Nacional de Estadística y Censo (INEC), Panamá'
    summary:
      es: El pie del sitio, bajo «Licencia para el uso de Datos abiertos», declara CC BY 4.0, que permite compartir y adaptar con atribución, enlace a la licencia e indicación de cambios.
      en: The site footer, under "Licence for the use of open data", declares CC BY 4.0, which allows sharing and adapting with credit, a link to the licence and an indication of changes.
  inei:
    institution: INEI
    countries: [PER]
    status: own_terms
    name: Aviso de reproducción del propio documento
    terms_url: https://www.inei.gob.pe/media/principales_indicadores/libro_bol_esp_24_4.pdf
    read_how: in_file
    raw_copy: allowed_with_source
    commercial: not_stated
    share_alike: false
    attribution: 'Fuente: Instituto Nacional de Estadística e Informática (INEI), Boletín Especial 24'
    summary:
      es: La página 2 del Boletín permite reproducir la información, total o parcialmente, mencionando al INEI como fuente de origen.
      en: Page 2 of the Bulletin allows reproducing the information, in whole or in part, naming INEI as the source.
  ine_pry:
    institution: INE Paraguay
    countries: [PRY]
    status: open_license
    name: Licencia de Uso de la Información Pública del Estado Paraguayo (Decreto 4064, Ley 5282/2014)
    license_url: https://www.ine.gov.py/microdatos/license.php
    terms_url: https://www.ine.gov.py/microdatos/license.php
    read_how: direct
    raw_copy: allowed
    commercial: allowed
    share_alike: false
    attribution: 'Fuente: INE Paraguay, Estimaciones y proyecciones nacional 1950-2050, Revisión 2024, archivo modificado el 2025-11-27. Contenido regido por la Licencia de Uso de la Información Pública del Estado Paraguayo.'
    summary:
      es: Autorización gratuita y perpetua para copiar, distribuir y transformar. Exige citar la fuente, indicar que rige esta licencia, dar la fecha de última actualización si se conoce y no sugerir un uso oficial.
      en: A free, perpetual authorization to copy, distribute and transform. It requires citing the source, stating that this licence applies, giving the last update date if known and not suggesting official use.
  onec:
    institution: ONEC / BCR (antes DIGESTYC)
    countries: [SLV]
    status: no_license
    name: Sin licencia localizada para este archivo
    terms_url: https://onec.bcr.gob.sv/servicios/proyecciones-y-estimaciones-de-poblacion-nacional-y-departamental/
    read_how: browser
    raw_copy: not_stated
    commercial: not_stated
    share_alike: false
    attribution: 'Fuente: Banco Central de Reserva, Oficina Nacional de Estadística y Censos (ONEC), Estimaciones y proyecciones de población, revisión 2021'
    summary:
      es: Ni la página de la ONEC ni la del BCR muestran términos de uso o licencia, y el archivo no trae aviso.
      en: Neither the ONEC page nor the BCR page shows terms of use or a licence, and the file carries no notice.
  ine_ury:
    institution: INE Uruguay
    countries: [URY]
    status: own_terms
    name: Términos de uso del portal del INE
    terms_url: https://www.gub.uy/instituto-nacional-estadistica/terminos-y-condiciones-de-uso
    read_how: direct
    raw_copy: not_stated
    commercial: not_stated
    share_alike: false
    attribution: 'Fuente: Instituto Nacional de Estadística (INE), Uruguay. Estimaciones y proyecciones de población, Revisión 2025'
    summary:
      es: Los términos consideran pública la información salvo indicación contraria, sin regular su reutilización. La Licencia de Datos Abiertos nacional sería más amplia, pero estos archivos no aparecen en el catálogo del INE, así que no se da por aplicada.
      en: The terms treat information as public unless stated otherwise, without regulating reuse. The national Open Data Licence would be broader, but these files do not appear in INE's catalogue, so it is not assumed to apply.
  ine_ven:
    institution: INE Venezuela
    countries: [VEN]
    status: no_license
    name: Sin licencia localizada para estos archivos
    terms_url: https://ine.gob.ve/marco-legal/
    read_how: direct
    raw_copy: not_stated
    commercial: not_stated
    share_alike: false
    attribution: 'Fuente: Instituto Nacional de Estadística (INE), República Bolivariana de Venezuela'
    summary:
      es: El sitio declara todos los derechos reservados. Una búsqueda por términos en la Ley de la Función Pública de Estadística no halló una cláusula sobre reutilizar cifras publicadas.
      en: The site declares all rights reserved. A term search of the Public Statistics Function Act found no clause on reusing published figures.
