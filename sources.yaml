schema_version: 1
verified_at: '2026-11-01'
verification_method: Cada URL se abrió con comprobación TLS activa y agente identificado. Los bloqueos se registran
  y no se eluden. Las cifras de control se leyeron en el archivo o, si se indica, en navegador.
verification_caveat: Comprobado desde una conexión residencial en Colombia; los ejecutores de GitHub Actions pueden
  recibir bloqueos distintos.
status_values:
  ok: descargable por script y cifra de control leída
  manual: dato existe pero la descarga automática no procede; un humano deja el archivo en data/raw/
  pendiente: sin archivo verificado; nunca se rellena
open_decisions:
  D1: CEPALSTAT cita a WPP como coproductor y la API (Revisión 2022) no coincide con la página de Excel (Revisión
    2024). ¿Se acepta como respaldo CEPAL?
  D2: 'Cuba, sin sitio oficial accesible: ¿pendiente o CEPAL provisional?'
  D3: 'Años anteriores a la serie nacional y puntos sueltos: ¿completar con CEPAL o dejar null?'
  D4: 'México: ¿manual o agente de navegador en datos.gob.mx?'
