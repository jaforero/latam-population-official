decisions:
  D1: 'Sustituida por D5 el 2026-11-01. Antes: CEPAL/CELADE se aceptó como respaldo. Se pasó de la API CEPALSTAT
    (Revisión 2022) al Excel de la Revisión 2024 aportado por Javier Forero (003_COMPARATIVO.xlsx), que responde
    a un agente identificado. El Excel cita coproducción con la ONU (WPP 2024).'
  D2: 'Actualizado 2026-11-01: Cuba usa un respaldo marcado, hoy la ONU (D5). ONEI
    sigue sin ser verificable (certificado vencido); si vuelve a responder, se abre una alerta para sustituirla
    por la serie nacional.'
  D3: 'Aprobado 2026-11-01: los años previos a la serie nacional quedan null, salvo Honduras (sin ninguna serie
    nacional antes de 2013). La cifra IHSI 2024 de Haití es contraste, no se mezcla.'
  D4: 'Aprobado 2026-11-01: México queda manual; no se falsea el agente de usuario.'
  D5: 'Aprobado 2026-11-01 por Javier Forero: ONU World Population Prospects 2024 reemplaza a CEPAL/CELADE como respaldo marcado. La cláusula 4 de los términos de CEPAL no permite redistribuir ni crear otros trabajos; la ONU publica bajo CC BY 3.0 IGO. Se descartó el FMI porque su serie LP no trae a Cuba, empieza en 1980 o después y no tiene edad ni sexo. La institución nacional sigue prevaleciendo.'
