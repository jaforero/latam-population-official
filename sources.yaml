decisions:
  D1: 'Aprobado 2026-11-01 y actualizado el mismo día: CEPAL/CELADE se acepta como respaldo. Se pasó de la API CEPALSTAT
    (Revisión 2022) al Excel de la Revisión 2024 aportado por Javier Forero (003_COMPARATIVO.xlsx), que responde
    a un agente identificado. El Excel cita coproducción con la ONU (WPP 2024).'
  D2: 'Aprobado 2026-11-01: Cuba queda pendiente; no se usa CEPAL provisional porque existe serie nacional. El mismo
    criterio aplica a Guatemala y República Dominicana, aunque 003_COMPARATIVO.xlsx también los incluye.'
  D3: 'Aprobado 2026-11-01: los años previos a la serie nacional quedan null, salvo Honduras (sin ninguna serie
    nacional antes de 2013). La cifra IHSI 2024 de Haití es contraste, no se mezcla.'
  D4: 'Aprobado 2026-11-01: México queda manual; no se falsea el agente de usuario.'
